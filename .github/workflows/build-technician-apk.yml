name: Build DiagAssist Technician APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/diagassist-technician/**"
      - ".github/workflows/build-technician-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/diagassist-technician

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: diagassist-technician-debug
          path: android/diagassist-technician/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
